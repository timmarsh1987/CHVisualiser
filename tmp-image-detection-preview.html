<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image detection preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e4e7eb;
      }
      #frame {
        width: min(420px, 100%);
        height: 100%;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 0 1px #d9e2ec;
      }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <script type="module">
      import createExternalRoot from '/CHImageDetection.js';

      const previewSvg = encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
          <rect width="800" height="520" fill="#d9e2ec"/>
          <ellipse cx="430" cy="280" rx="170" ry="110" fill="#c4a574"/>
          <circle cx="330" cy="230" r="46" fill="#8d6e63"/>
          <rect x="80" y="70" width="70" height="120" rx="8" fill="#f4d35e"/>
          <text x="36" y="40" font-family="Segoe UI, sans-serif" font-size="22" fill="#102a43">Local preview image</text>
        </svg>
      `);
      const previewUrl = `data:image/svg+xml,${previewSvg}`;

      const report = {
        status: 'flagged',
        summary: 'An animal is visible. No children were detected in this preview.',
        findings: [
          {
            id: 'animals',
            label: 'Animals',
            detected: true,
            confidence: 91,
            summary: 'An animal shape is visible in the center of the frame.',
            regions: [{ x: 28, y: 28, width: 48, height: 42 }],
          },
          {
            id: 'minors',
            label: 'Children / minors',
            detected: false,
            confidence: 84,
            summary: 'No children are visible.',
            regions: [],
          },
        ],
        checksRun: ['animals', 'minors'],
        analyzedAt: new Date().toISOString(),
        imageAttached: true,
      };

      const entity = {
        id: 'preview-asset',
        systemProperties: { id: 'preview-asset' },
        definitionName: 'M.Asset',
        properties: {
          Title: 'Local preview',
          FileName: 'preview.jpg',
          MimeType: 'image/jpeg',
          ImageDetectionReport: report,
        },
        renditions: [{ name: 'preview', items: [{ href: previewUrl }] }],
      };

      const api = createExternalRoot(document.getElementById('frame'));
      api.render({
        theme: { palette: { mode: 'light' } },
        config: {
          apiBaseUrl: 'http://127.0.0.1:5202',
          apiToken: 'local-preview',
        },
        client: {
          raw: {
            async getAsync() {
              return {
                isSuccessStatusCode: true,
                statusCode: 200,
                content: {
                  properties: entity.properties,
                  renditions: {
                    preview: [{ href: previewUrl }],
                  },
                },
              };
            },
          },
        },
        entity,
      });
    </script>
  </body>
</html>
